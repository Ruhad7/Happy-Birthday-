
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Arial Black', sans-serif;
    }
    h1 {
      color: black;
      font-size: 3em;
      text-align: center;
      animation: bounce 2s infinite;
    }
    p {
      color: black;
      font-size: 1.5em;
      text-align: center;
      animation: bounce 2s infinite;
      animation-delay: 0.3s;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-20px);}
      60% {transform: translateY(-10px);}
    }
    .balloon {
      position: absolute;
      bottom: -150px;
      width: 60px;
      height: 80px;
      border-radius: 50%;
      background-color: red;
      animation: float 10s linear infinite;
    }
    @keyframes float {
      0% {transform: translateY(0) rotate(0deg); opacity: 1;}
      100% {transform: translateY(-110vh) rotate(360deg); opacity: 0;}
    }
    #playButton {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 1.2em;
      font-weight: bold;
      background: orange;
      color: black;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Happy Birthday</h1>
  <p>This is for your birthday breakfast, love you</p>

  <button id="playButton">🎵 Play Music</button>

  <audio id="bgMusic" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-ukulele.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const colors = ["#FF6347", "#FFD700", "#ADFF2F", "#00BFFF", "#FF69B4", "#FF8C00"];
    function createBalloon() {
      const balloon = document.createElement("div");
      balloon.classList.add("balloon");
      const color = colors[Math.floor(Math.random() * colors.length)];
      balloon.style.backgroundColor = color;
      balloon.style.left = Math.random() * window.innerWidth + "px";
      balloon.style.animationDuration = (6 + Math.random() * 5) + "s";
      document.body.appendChild(balloon);
      setTimeout(() => { balloon.remove(); }, 12000);
    }
    setInterval(createBalloon, 800);

    // Enable music on button click (works on Safari/iOS)
    document.getElementById("playButton").addEventListener("click", function() {
      const music = document.getElementById("bgMusic");
      music.play();
      this.style.display = "none"; // Hide button after play
    });
  </script>
</body>
</html>
